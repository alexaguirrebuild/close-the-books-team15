[project]
name = "bankcheck"
version = "0.1.0"
description = "Ingesta, validación y evaluación para el reto Close the Books"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb==1.5.6",
    "openpyxl==3.1.5",
    "pypdfium2==4.30.0",
]

[project.scripts]
bankcheck = "bankcheck.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bankcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: necesita la carpeta de datos real (data/sample)"]
